name: MiniAI Multi-Platform CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance-and-python-ml:
    name: Governance & Python ML (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Run Python ML & Governance Test Suite (>=90% Coverage)
        working-directory: ml
        run: uv run --python 3.12 pytest --cov=miniai_ml --cov-report=term-missing --cov-fail-under=90

  rust-core:
    name: Rust Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust unit & contract tests
        run: cargo test --workspace

  flutter-desktop-and-tests:
    name: Flutter UI & Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: ui/miniai_app
        run: flutter pub get

      - name: Run Flutter static analysis
        working-directory: ui/miniai_app
        run: flutter analyze --no-pub

      - name: Run Flutter widget & unit tests with coverage
        working-directory: ui/miniai_app
        run: flutter test --coverage --reporter=expanded

  flutter-android:
    name: Flutter Android Target (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'
          channel: stable
          cache: true

      - name: Analyze & Test Android Target
        working-directory: ui/miniai_app
        run: |
          flutter pub get
          flutter analyze --no-pub
          flutter test --reporter=expanded

  flutter-ios:
    name: Flutter iOS Target (macos-latest)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'
          channel: stable
          cache: true

      - name: Analyze & Test iOS Target
        working-directory: ui/miniai_app
        run: |
          flutter pub get
          flutter analyze --no-pub
          flutter test --reporter=expanded

