name: MiniAI Cross-Platform Release & Certification

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test-rust:
    name: Build & Verify Rust Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release workspace & run tests
        run: |
          cargo build --workspace --release
          cargo test --workspace --release

  build-flutter-cross-platform:
    name: Verify Flutter Targets (Android & iOS)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: "stable"

      - name: Run Flutter analyze & test
        working-directory: ui/miniai_app
        run: |
          flutter analyze --no-pub
          flutter test --coverage

  package-and-checksum-release:
    name: Package Release Bundles, SBOM & Checksums
    runs-on: ubuntu-latest
    needs: [build-and-test-rust, build-flutter-cross-platform]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Release Packaging Generator
        run: |
          python scripts/package_release.py --version 1.0.0

      - name: Verify Cryptographic Checksums & CycloneDX SBOM
        run: |
          python scripts/package_release.py --version 1.0.0 --verify

      - name: Upload Release Bundles & SBOM Manifests
        uses: actions/upload-artifact@v4
        with:
          name: miniai-v1.0.0-release-bundles
          path: dist/v1.0.0/
          if-no-files-found: error
