name: MiniAI Cross-Platform Release & Certification

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test-rust:
    name: Build & Verify Rust Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release workspace & run tests
        run: |
          cargo build --workspace --release
          cargo test --workspace --release

      - name: Upload Rust Release Binaries
        uses: actions/upload-artifact@v4
        with:
          name: miniai-server-release-${{ matrix.os }}
          path: |
            target/release/miniai-server*
            !target/release/miniai-server*.d
            !target/release/miniai-server*.pdb

  build-flutter-cross-platform:
    name: Build Cross-Platform Mobile Packages (Android & iOS)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.4"
          channel: "stable"
          cache: true

      - name: Install Flutter Dependencies & Verify Tests
        working-directory: ui/miniai_app
        run: |
          flutter pub get
          flutter analyze --no-pub
          flutter test --coverage --reporter=expanded

      - name: Build Android Release APK
        working-directory: ui/miniai_app
        run: flutter build apk --release

      - name: Build Android App Bundle (AAB)
        working-directory: ui/miniai_app
        run: flutter build appbundle --release

      - name: Build iOS Application (Unsigned)
        working-directory: ui/miniai_app
        run: flutter build ios --no-codesign --release

      - name: Package Unsigned iOS IPA
        working-directory: ui/miniai_app
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r miniai-ios-unsigned.ipa Payload

      - name: Upload Mobile Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: miniai-mobile-release-binaries
          path: |
            ui/miniai_app/build/app/outputs/flutter-apk/app-release.apk
            ui/miniai_app/build/app/outputs/bundle/release/app-release.aab
            ui/miniai_app/miniai-ios-unsigned.ipa
          if-no-files-found: error

  package-and-checksum-release:
    name: Package Release Bundles, SBOM & Checksums
    runs-on: ubuntu-latest
    needs: [build-and-test-rust, build-flutter-cross-platform]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: build-artifacts

      - name: Run Release Packaging Generator
        run: |
          python scripts/package_release.py --version 1.0.0

      - name: Verify Cryptographic Checksums & CycloneDX SBOM
        run: |
          python scripts/package_release.py --version 1.0.0 --verify

      - name: Upload Release Bundles & SBOM Manifests
        uses: actions/upload-artifact@v4
        with:
          name: miniai-v1.0.0-release-bundles
          path: dist/v1.0.0/
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/v1.0.0/*
          generate_release_notes: true
