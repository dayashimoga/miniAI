[workspace]
resolver = "2"
members = [
    "crates/miniai-core",
    "crates/miniai-storage",
    "crates/miniai-server",
    "crates/miniai-registry",
    "crates/miniai-runtime",
    "crates/miniai-llm",
    "crates/miniai-rag",
    "crates/miniai-vision",
    "crates/miniai-imagegen",
    "crates/miniai-speech-asr",
    "crates/miniai-speech-tts",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["MiniAI Engineering Team"]
repository = "https://github.com/dayashimoga/miniAI"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.40", features = ["sync", "rt", "macros", "net", "io-util", "time"] }

