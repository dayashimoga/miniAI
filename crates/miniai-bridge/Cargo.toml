[package]
name = "miniai-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "miniai_bridge"
crate-type = ["cdylib", "rlib"]

[dependencies]
miniai-core = { path = "../miniai-core" }
miniai-storage = { path = "../miniai-storage" }
miniai-server = { path = "../miniai-server" }
miniai-registry = { path = "../miniai-registry" }
miniai-runtime = { path = "../miniai-runtime" }
miniai-llm = { path = "../miniai-llm" }
miniai-rag = { path = "../miniai-rag" }
miniai-memory = { path = "../miniai-memory" }
miniai-vision = { path = "../miniai-vision" }
miniai-imagegen = { path = "../miniai-imagegen" }
miniai-speech-asr = { path = "../miniai-speech-asr" }
miniai-speech-tts = { path = "../miniai-speech-tts" }
miniai-music = { path = "../miniai-music" }
miniai-video = { path = "../miniai-video" }
miniai-cloud = { path = "../miniai-cloud" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
sysinfo = { version = "0.40", default-features = false, features = ["system"] }

[dev-dependencies]
tempfile = "3.12"

