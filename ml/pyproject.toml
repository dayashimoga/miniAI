[project]
name = "miniai-ml"
version = "0.1.0"
description = "MiniAI Python ML tooling, cross-language contract validators, CPU-first runtime probes, and repository governance auditors."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "MiniAI Engineering Team" }]
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/miniai_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
